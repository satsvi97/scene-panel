<div class="scene-panel-float" id="scene_panel_float">
    <div class="scene-panel-float-head">
        <span class="scene-panel-float-day" id="scene_panel_float_day">день 1</span>
        <span class="scene-panel-float-spacer"></span>
        <div class="scene-panel-float-btn" id="scene_panel_float_day_minus" title="предыдущий день">−</div>
        <div class="scene-panel-float-btn" id="scene_panel_float_day_plus" title="следующий день">+</div>
        <div class="scene-panel-float-btn" id="scene_panel_float_collapse" title="свернуть">–</div>
        <div class="scene-panel-float-btn" id="scene_panel_float_hide" title="скрыть">×</div>
    </div>
    <div class="scene-panel-float-body">
        <div class="scene-cal scene-cal-compact" id="scene_panel_float_cal">
            <div class="scene-cal-head">
                <span class="scene-cal-btn scene-cal-prev" title="предыдущий месяц">‹</span>
                <span class="scene-cal-title">месяц 1</span>
                <span class="scene-cal-btn scene-cal-next" title="следующий месяц">›</span>
            </div>
            <div class="scene-cal-grid"></div>
        </div>
        <div class="scene-panel-float-place" id="scene_panel_float_place">—</div>
        <div class="scene-panel-float-sub" id="scene_panel_float_when"></div>
        <div class="scene-panel-float-sub" id="scene_panel_float_present">—</div>
        <div class="scene-panel-float-mood" id="scene_panel_float_mood"></div>
        <div class="scene-panel-float-threads" id="scene_panel_float_open"></div>
    </div>
</div>
