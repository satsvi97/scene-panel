<div class="scene-panel-wrap" id="scene_panel_settings_compact">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>✦ SCENE PANEL ✦</b>
            <span class="scene-panel-day" id="scene_panel_day_compact">день 1</span>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label scene-panel-check">
                <input type="checkbox" id="scene_panel_enabled">
                <span data-i18n="enabled">расширение включено</span>
            </label>
            <div class="scene-panel-actions">
                <div class="menu_button" id="scene_panel_open_modal" data-i18n="openPanel">открыть панель сцены</div>
            </div>
            <div class="scene-panel-hint" data-i18n="drawerHint"></div>
        </div>
    </div>
</div>
